services:
  ticket-creator:
    container_name: ticket-creator-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_APPLE_CLIENT_ID: ${VITE_APPLE_CLIENT_ID:-}
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${TICKET_CREATOR_PORT:-3000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - lci-dispatch-api

  lci-dispatch-api:
    container_name: ticket-creator-lci-dispatch-api
    build:
      context: .
      dockerfile: Dockerfile.lci-api
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: 8787
      LCI_GATEWAY_URL: ${LCI_GATEWAY_URL:-http://192.168.47.140}
      LCI_USERNAME: ${LCI_USERNAME}
      LCI_PASSWORD: ${LCI_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL:-${VITE_SUPABASE_URL}}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_ANON_KEY:-}}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      LOADRITE_SYNC_USER_ID: ${LOADRITE_SYNC_USER_ID:-}
