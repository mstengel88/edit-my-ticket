services:
  ticket-creator:
    container_name: ghos-ticket-creator
    build:
      context: .
      dockerfile: Dockerfile.ghos-compat
    ports: !override
      - "${TICKET_CREATOR_PORT:-8084}:80"
    restart: unless-stopped
    depends_on:
      lci-dispatch-api:
        condition: service_healthy
    networks:
      - ghos-internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  lci-dispatch-api:
    container_name: ghos-ticket-creator-lci-api
    build:
      context: .
      dockerfile: Dockerfile.lci-api
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: 8787
      LCI_GATEWAY_URL: ${LCI_GATEWAY_URL:-http://192.168.47.140}
      LCI_USERNAME: ${LCI_USERNAME}
      LCI_PASSWORD: ${LCI_PASSWORD}
      SUPABASE_URL: http://100.75.152.30:18000
      SUPABASE_PUBLISHABLE_KEY: ${OPERATIONS_ANON_KEY}
      SUPABASE_ANON_KEY: ${OPERATIONS_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${OPERATIONS_SERVICE_ROLE_KEY}
      LOADRITE_SYNC_USER_ID: ${LOADRITE_SYNC_USER_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5

  loadrite-lci-relay:
    container_name: ghos-ticket-creator-loadrite-relay
    profiles:
      - loadrite-auto-sync
    build:
      context: .
      dockerfile: Dockerfile.lci-relay
    network_mode: host
    restart: unless-stopped
    environment:
      LCI_GATEWAY_URL: ${LCI_GATEWAY_URL:-http://192.168.47.140}
      LCI_REFRESH_INTERVAL_MS: 120000
      LOADRITE_SYNC_USER_ID: ${LOADRITE_SYNC_USER_ID}
      SUPABASE_URL: http://100.75.152.30:18000
      SUPABASE_SERVICE_ROLE_KEY: ${OPERATIONS_SERVICE_ROLE_KEY}

networks:
  ghos-internal:
    external: true
    name: ghos-internal
